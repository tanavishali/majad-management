<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --soft:#F5F6F8; --ink:#1A2230; --muted:#6B7686; --line:#E7E9EE;
  --accent:#0B7A68; --accent-ink:#FFFFFF; --accent-soft:#E3F4F0;
  --warn-bg:#FFF4D9; --warn-ink:#7B4B00; --warn-line:#EFC25C;
  --ok:#0B7A68; --ok-soft:#E3F4F0; --bad:#C23B3B; --bad-soft:#FCE9E9; --hold:#8A5A00; --hold-soft:#FFF4D9;
  --head:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171F; --soft:#1B222D; --ink:#EDF1F7; --muted:#97A3B7; --line:#2A3340;
    --accent:#3FD0B4; --accent-ink:#06211B; --accent-soft:#123B34;
    --warn-bg:#3A2D10; --warn-ink:#F6D38A; --warn-line:#8A6A1F;
    --ok:#3FD0B4; --ok-soft:#123B34; --bad:#FF8E8E; --bad-soft:#431D1D; --hold:#F6D38A; --hold-soft:#3A2D10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171F; --soft:#1B222D; --ink:#EDF1F7; --muted:#97A3B7; --line:#2A3340;
  --accent:#3FD0B4; --accent-ink:#06211B; --accent-soft:#123B34;
  --warn-bg:#3A2D10; --warn-ink:#F6D38A; --warn-line:#8A6A1F;
  --ok:#3FD0B4; --ok-soft:#123B34; --bad:#FF8E8E; --bad-soft:#431D1D; --hold:#F6D38A; --hold-soft:#3A2D10;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.page{max-width:980px;margin:0 auto;padding:20px 18px 60px}

/* header */
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}
.brand{font-family:var(--head);font-weight:700;font-size:24px;line-height:1.15;letter-spacing:-.02em;margin:0}
.sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.sub b{color:var(--ink);font-weight:600}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:13.5px}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary:hover{opacity:.88;background:var(--ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.accent:hover{background:var(--accent);filter:brightness(1.06)}
.btn.small{min-height:32px;padding:0 11px;font-size:13px}
.btn.danger{color:var(--bad)}
.icon-btn{width:36px;padding:0}

/* day strip */
.strip{display:flex;gap:5px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 8px;scrollbar-width:thin}
.day{flex:0 0 48px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border:1px solid var(--line);border-radius:6px;background:var(--bg);min-height:58px}
.day:hover{background:var(--soft)}
.day .w{font-size:11.5px;color:var(--muted)}
.day .n{font-family:var(--head);font-weight:700;font-size:16px;line-height:1.1}
.day .dots{display:flex;gap:3px;height:5px;margin-top:2px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day[aria-pressed=true] .w{color:inherit;opacity:.75}
.day[aria-pressed=true] .dots i{background:var(--bg)}
.day.today .n{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}

/* toolbar */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.tabs{display:flex;gap:3px;background:var(--soft);padding:3px;border-radius:6px}
.tab{border:0;background:transparent;min-height:30px;padding:0 14px;border-radius:6px;font-weight:600;color:var(--muted);font-size:13px}
.tab[aria-selected=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(20,30,50,.14)}
.search{flex:1;min-width:160px;min-height:36px;padding:0 12px;font-size:13.5px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.search:focus{border-color:var(--accent)}
.filter-note{display:none;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin:6px 0 0}
.filter-note.show{display:flex}
.link{border:0;background:none;color:var(--accent);font-weight:600;text-decoration:underline;padding:4px;font-size:14px}

/* list */
.group{margin-top:14px}
.group h2{display:flex;align-items:baseline;gap:10px;margin:0 0 2px;font-family:var(--head);font-weight:700;font-size:15px;letter-spacing:-.01em}
.group h2 span{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.row{display:grid;grid-template-columns:64px 1fr auto;align-items:center;width:100%;text-align:left;background:var(--bg);border:0;border-top:1px solid var(--soft);padding:8px 2px;gap:10px;position:relative}
.group h2+.row{border-top:0}
.row:hover{background:var(--soft)}
.time{font-family:var(--head);font-weight:700;font-size:16px;line-height:1;letter-spacing:-.02em;padding-right:8px;display:block}
.time small{display:block;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:0;color:var(--muted);margin-top:3px}
.mid{display:flex;align-items:center;gap:10px;min-width:0}
.pic{flex:none;width:36px;height:36px;border-radius:6px;background:var(--accent-soft) center/cover no-repeat;display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:15px;color:var(--accent)}
.who{min-width:0}
.who b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.who span{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{text-align:right}
.price{display:block;font-family:var(--head);font-weight:700;font-size:14px}
.badge{display:inline-block;margin-top:3px;font-size:11px;font-weight:600;padding:1px 8px;border-radius:6px}
.badge.pending{background:var(--hold-soft);color:var(--hold)}
.badge.delivered{background:var(--ok-soft);color:var(--ok)}
.badge.cancelled{background:var(--bad-soft);color:var(--bad)}
.badge.overdue{background:var(--bad-soft);color:var(--bad)}
@media (max-width:560px){
  .page{padding:14px 12px 60px}
  .brand{font-size:22px}
  .row{grid-template-columns:58px 1fr;gap:8px}
  .time{font-size:15px;padding-right:6px}
  .side{grid-column:2;display:flex;justify-content:space-between;align-items:center;text-align:left}
  .pic{width:34px;height:34px;font-size:14px}
  .head{flex-direction:column}
}

.empty{margin-top:20px;padding:28px 16px;text-align:center;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted)}
.empty b{display:block;font-family:var(--head);font-size:16px;color:var(--ink);margin-bottom:2px}

/* dialogs */
dialog{border:0;padding:0;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(18,24,34,.45)}
.center{border-radius:10px;max-width:480px;width:calc(100% - 28px);box-shadow:0 24px 70px rgba(10,20,40,.3)}
.pad{padding:16px}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dh h3{margin:0;font-family:var(--head);font-weight:700;font-size:19px;letter-spacing:-.02em}
.scroll{overflow:visible}

label{display:block;font-size:12.5px;font-weight:600;margin:0 0 4px}
.field{margin-bottom:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text],input[type=password],input[type=tel],input[type=number],input[type=date],input[type=time],textarea{
  width:100%;min-height:36px;padding:6px 11px;border:1px solid var(--line);border-radius:6px;background:var(--soft)}
textarea{resize:vertical;min-height:58px}
input:focus,textarea:focus{border-color:var(--accent);background:var(--bg)}
input.invalid{border-color:var(--warn-line);background:var(--warn-bg)}

.booked{display:none;margin:-4px 0 14px;font-size:14px;color:var(--muted)}
.booked.show{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{padding:3px 11px;border-radius:6px;background:var(--soft);border:1px solid var(--line);font-weight:600;color:var(--ink);font-size:13.5px}
.chip.hit{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.clash{display:none;margin:0 0 14px;padding:12px 14px;border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn-ink);border-radius:6px;font-size:14.5px}
.clash.show{display:block}
.clash b{display:block}

.photo{display:flex;align-items:center;gap:14px}
.thumb{width:72px;height:72px;border-radius:6px;border:1.5px dashed var(--line);background:var(--soft) center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-size:12.5px;flex:none}
.thumb.has{border-style:solid}
.photo .btns{display:flex;gap:8px;flex-wrap:wrap}
.foot{display:flex;gap:10px;margin-top:8px}
.foot .btn{flex:1}

.kv{display:grid;grid-template-columns:72px 1fr;gap:5px 10px;margin:0 0 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.dimg{width:100%;max-height:250px;object-fit:cover;border-radius:6px;margin-bottom:14px;display:block}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.existing{border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn-ink);border-radius:6px;padding:12px 14px;margin:0 0 16px;font-size:15px}
.dlg-p{margin:0 0 12px}

.auth{min-height:100dvh;display:grid;place-items:center;padding:24px 18px}
.auth[hidden]{display:none}
.auth form{width:100%;max-width:400px}
.auth .brand{font-size:34px}
.auth .sub{margin:8px 0 24px}
.auth .btn{width:100%;margin-top:6px}
.pwshow{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px;color:var(--muted);margin:0 0 14px}
.pwshow input{width:18px;height:18px;min-height:0;accent-color:var(--accent)}
.switch{margin:16px 0 0;text-align:center;color:var(--muted);font-size:15px}
.hello{margin:6px 0 0;font-size:14px;color:var(--accent);font-weight:600}
.gal{max-width:1000px;width:min(1000px,calc(100% - 28px))}
.gal .pad{max-height:92dvh;overflow-y:auto}
.gcount{font-family:var(--body);font-weight:500;font-size:15px;color:var(--muted);margin-left:8px;letter-spacing:0}
.galgrid{display:block;column-width:230px;column-gap:10px}
.galgrid.n1{column-count:1;column-width:auto;max-width:560px;margin:0 auto}
.gal.narrow{width:min(640px,calc(100% - 28px))}
.tile{display:block;width:100%;padding:0;margin:0 0 10px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--soft);break-inside:avoid;cursor:zoom-in}
.tile img{display:block;width:100%;height:auto;object-fit:contain}
.tile:hover{border-color:var(--accent)}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:24px 10px 8px;color:#fff;font-size:12.5px;text-align:left;background:linear-gradient(transparent,rgba(10,16,26,.75))}
.tile .cap b{display:block;font-size:14px;font-weight:600}
@media (max-width:560px){
  .gal{width:100%;max-width:none;height:100dvh;max-height:none;border-radius:6px;margin:0}
  .gal .pad{height:100dvh;max-height:100dvh;padding:16px}
  .galgrid{column-width:auto;column-count:2;column-gap:8px}
  .galgrid.n1{column-count:1;max-width:none}
  .gal.narrow{width:100%}
  .tile{margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){.tile img{transition:none}.tile:hover img{transform:none}}
.row{cursor:pointer}
.box{border:1px solid var(--line);border-radius:10px;padding:2px 14px 10px;background:var(--bg);margin-top:10px}
.box .group:first-child{margin-top:10px}
.tags{display:flex;gap:5px;align-items:center;justify-content:flex-end;margin-top:3px}
.tags .badge{margin-top:0}
.galmini{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:1px 9px;min-height:22px;font-size:11px;font-weight:600;color:var(--accent)}
.galmini:hover:not(:disabled){background:var(--accent-soft)}
.galmini:disabled{color:var(--muted);opacity:.65;cursor:default}
.pager{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--soft)}
.pinfo{color:var(--muted);font-size:12.5px}
.pnav{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pg{min-width:32px;min-height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:13px}
.pg:hover:not(:disabled){background:var(--soft)}
.pg.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pg:disabled{opacity:.4;cursor:default}
.dots2{color:var(--muted);padding:0 4px}
.pper{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin:0;font-weight:500}
.pper select{min-height:32px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
@media (max-width:560px){.box{padding:2px 10px 10px}.pager{justify-content:center}.galmini{min-height:26px}}
.plist{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.plist:empty{display:none}
.pth{position:relative;width:60px;height:60px;border-radius:6px;background:var(--soft) center/cover no-repeat;border:1px solid var(--line)}
.pth button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:6px;border:0;background:var(--ink);color:var(--bg);font-size:12px;line-height:1;display:grid;place-items:center}
.phint{margin-left:10px;font-size:13.5px;color:var(--muted)}
.lb{max-width:900px;width:min(900px,calc(100% - 20px));overflow:hidden}
.lb img{display:block;width:100%;max-height:72dvh;object-fit:contain;background:var(--soft)}
.lbbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;flex-wrap:wrap}
.lbbar span{color:var(--muted);font-size:14px}
.layout{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
.layout.calopen{grid-template-columns:290px 1fr}
.content{min-width:0}
.cal{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);position:sticky;top:12px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:14px}
.calnav{width:30px;height:30px;border:1px solid var(--line);background:var(--bg);border-radius:6px;font-size:16px;line-height:1}
.calnav:hover{background:var(--soft)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cw{text-align:center;font-size:11px;color:var(--muted);padding:2px 0 4px;font-weight:600}
.cd{min-height:38px;padding:3px 0 2px;border:1px solid transparent;border-radius:6px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:13px;font-weight:500}
.cd:hover{background:var(--soft)}
.cd.has{background:var(--accent-soft);color:var(--accent);font-weight:700}
.cd i{font-style:normal;font-size:10px;font-weight:700;line-height:1}
.cd.today{border-color:var(--accent)}
.cd[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.calfoot{display:flex;justify-content:space-between;margin-top:6px}
@media (max-width:760px){.layout{grid-template-columns:1fr}.cal{position:static}}
html{-webkit-text-size-adjust:100%}
.center{max-height:calc(100dvh - 24px);overflow-y:auto}
.formmodal{max-width:520px}
.formmodal .pad{padding-bottom:0}
.foot{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));margin-top:4px;border-top:1px solid var(--soft)}
.calbtn{margin-bottom:10px;gap:10px}
.calbtn .arr{display:inline-block;transition:transform .15s}
.calbtn[aria-expanded=true] .arr{transform:rotate(180deg)}
.layout .cal{display:none}
.layout.calopen .cal{display:block}
@media (max-width:760px){
  .calbtn{width:100%;justify-content:space-between}
  .layout.calopen{grid-template-columns:1fr}
  .layout.calopen .cal{margin-bottom:6px}
}
@media (prefers-reduced-motion:reduce){.calbtn .arr{transition:none}}
@media (max-width:560px){
  input[type=text],input[type=password],input[type=tel],input[type=number],input[type=date],input[type=time],textarea,.search,.pper select{font-size:16px}
  .btn{min-height:40px}
  .btn.small{min-height:38px}
  .icon-btn{width:40px}
  .head-actions{width:100%}
  .head-actions #newBtn{flex:1}
  .tabs{flex:1 1 100%}
  .tab{flex:1;min-height:34px}
  .search{flex:1 1 100%;min-height:40px}
  .side{flex-wrap:wrap;gap:4px 8px}
  .tags{flex-wrap:wrap}
  .btnrow .btn{flex:1 1 calc(50% - 4px)}
  .pg{min-width:36px;min-height:36px}
  .calnav{width:36px;height:36px}
  .pad{padding:14px}
  .dh h3{font-size:18px}
}
@media (max-width:360px){.two{grid-template-columns:1fr}}
.pages{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 14px}
.pgtab{border:0;background:none;padding:8px 16px;font-weight:600;color:var(--muted);font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px;min-height:40px}
.pgtab:hover{color:var(--ink)}
.pgtab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.dfilters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:4px}
.dnav{display:flex;align-items:center;gap:8px}
.dnav[hidden],.dcustom[hidden]{display:none}
.dnav b{min-width:170px;text-align:center;font-size:14px}
.dcustom{display:flex;gap:10px;flex-wrap:wrap}
.dcustom label{display:flex;align-items:center;gap:6px;margin:0;font-weight:500}
.dcustom input{width:auto;min-height:34px}
.dbox{margin-top:12px;padding:14px 16px}
.dbox h2{margin:0 0 10px;font-family:var(--head);font-size:15px;font-weight:700}
.kpi{display:grid;grid-template-columns:minmax(190px,1fr) 2fr;gap:18px;align-items:center}
.hero span{color:var(--muted);font-size:13px}
.hero b{display:block;font-family:var(--head);font-weight:700;font-size:30px;line-height:1.15}
.hero .chg{display:block;margin-top:4px;font-size:12.5px;font-weight:600}
.pos{color:var(--ok)}
.neg{color:var(--bad)}
.kv4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0}
.kv4>div{border-left:1px solid var(--line);padding-left:12px}
.kv4 dt{color:var(--muted);font-size:12px}
.kv4 dd{margin:2px 0 0;font-family:var(--head);font-weight:700;font-size:16px}
.note{margin:12px 0 0;font-size:12.5px;color:var(--hold);background:var(--hold-soft);padding:8px 10px;border-radius:6px}
.tablewrap{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th{text-align:left;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt td{padding:7px 8px;border-bottom:1px solid var(--soft);white-space:nowrap}
.dt th.r,.dt td.r{text-align:right}
.dt tfoot td{font-weight:700;border-bottom:0;border-top:1px solid var(--line)}
.dt tr.go{cursor:pointer}
.dt tr.go:hover{background:var(--soft)}
@media (max-width:640px){
  .kpi{grid-template-columns:1fr}
  .kv4{grid-template-columns:repeat(2,1fr)}
  .dnav{width:100%;justify-content:space-between}
  .dnav b{min-width:0;flex:1}
  .dbox{padding:12px}

<script>
(function(){
  var LEGACY_KEY='orderDesk.orders.v1', USERS_KEY='orderDesk.users.v1', SESSION_KEY='orderDesk.session', LOCK_KEY='orderDesk.lock', THEME_KEY='orderDesk.theme', KEY='', currentUser=null;
  var orders=[], photos=[], fStatus='all', fSource='', sortBy='auto', mode='list', dateSel='all', oFrom='', oTo='', page=1, perPage=8, galOrderId=null, lbList=[], lbIdx=0, MAX_PHOTOS=6, curPage='orders', dPeriod='month', dAnchor=new Date(), dStatus='delivered', dFrom='', dTo='', srcVal='';
  var $=function(id){return document.getElementById(id)};

  /* ---------- storage ---------- */
  function load(){
    try{var raw=localStorage.getItem(KEY); if(raw){orders=JSON.parse(raw)||[];assignNos();return;}}catch(e){}
    var seeded=null;try{seeded=localStorage.getItem('orderDesk.seeded.v1')}catch(e){}
    if(!seeded){
      orders=demoOrders();assignNos();
      try{localStorage.setItem('orderDesk.seeded.v1','1')}catch(e){}
    }else orders=[];
  }
  function persist(){
    try{localStorage.setItem(KEY,JSON.stringify(orders));return true;}
    catch(e){toast('Could not save on this device. Try a smaller photo.');return false;}
  }
  function uid(){return 'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function seed(){
    var t=new Date(),a=new Date(t),b=new Date(t),c=new Date(t),d=new Date(t);
    a.setDate(t.getDate()+1); b.setDate(t.getDate()+1); c.setDate(t.getDate()+3); d.setDate(t.getDate()-4);
    return [
      {id:uid(),name:'Ali Raza',phone:'0300 1234567',date:ymd(a),time:'11:30',address:'House 12, Street 5, Gulberg III, Lahore',price:4500,notes:'Call before arriving. Gate is blue.',status:'pending',img:''},
      {id:uid(),name:'Sana Malik',phone:'0321 7654321',date:ymd(b),time:'14:00',address:'Flat 4B, Askari 10, Lahore Cantt',price:12800,notes:'Fragile items, handle with care.',status:'pending',img:''},
      {id:uid(),name:'Hira Noor',phone:'0345 9988776',date:ymd(c),time:'17:30',address:'Block C, Johar Town, Lahore',price:7200,notes:'',status:'pending',img:''},
      {id:uid(),name:'Usman Tariq',phone:'0333 5550101',date:ymd(d),time:'16:00',address:'Shop 7, Liberty Market, Lahore',price:2300,notes:'',status:'delivered',img:''}
    ];
  }

  /* ---------- helpers ---------- */
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function parse(d){var p=d.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
  function fmtDate(d){return parse(d).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
  function parts(t){var p=t.split(':'),h=+p[0];return{h:h%12||12,m:p[1],ap:h>=12?'PM':'AM'}}
  function fmtTime(t){if(!t)return'';var x=parts(t);return x.h+':'+x.m+' '+x.ap}
  function money(n){return 'Rs '+Number(n||0).toLocaleString('en-US')}
  function when(o){return fmtDate(o.date)+' at '+fmtTime(o.time)}
  function stamp(o){return o.date+'T'+o.time}
  function nowStamp(){var n=new Date();return ymd(n)+'T'+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')}
  function dayName(d){
    var t=ymd(new Date()),tm=new Date();tm.setDate(tm.getDate()+1);var y=new Date();y.setDate(y.getDate()-1);
    var short=parse(d).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
    if(d===t)return 'Today';if(d===ymd(tm))return 'Tomorrow';if(d===ymd(y))return 'Yesterday';
    return short;
  }
  function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},2700)}

  /* ---------- clash ---------- */
  function sameDay(date,ignoreId){
    return orders.filter(function(o){return o.id!==ignoreId&&o.status!=='cancelled'&&o.date===date}).sort(function(a,b){return a.time<b.time?-1:1});
  }
  var GAP=45; /* minimum minutes between two orders */
  function mins(date,time){var p=date.split('-'),t=time.split(':');return Date.UTC(+p[0],+p[1]-1,+p[2],+t[0],+t[1])/60000}
  function tooClose(o,date,time){return !!(date&&time&&o.date&&o.time)&&Math.abs(mins(o.date,o.time)-mins(date,time))<GAP}
  function findClash(date,time,ignoreId){
    if(!date||!time)return null;
    var m=mins(date,time),best=null,bd=1e9;
    orders.forEach(function(o){
      if(o.id===ignoreId||o.status==='cancelled'||!o.date||!o.time)return;
      var d=Math.abs(mins(o.date,o.time)-m);
      if(d<GAP&&d<bd){best=o;bd=d}
    });
    return best;
  }
  function liveClash(){
    var date=$('date').value,time=$('time').value,id=$('editId').value;
    var list=date?sameDay(date,id):[];
    var b=$('booked');
    if(date&&list.length){
      b.innerHTML='Already booked on '+esc(fmtDate(date))+':<div class="chips">'+list.map(function(o){
        return '<span class="chip'+(tooClose(o,date,time)?' hit':'')+'">'+esc(fmtTime(o.time))+' '+esc(o.name)+'</span>';
      }).join('')+'</div><div style="margin-top:6px">Keep at least '+GAP+' minutes between orders.</div>';
      b.classList.add('show');
    }else if(date){

    up.sort(function(a,b){return stamp(a)<stamp(b)?-1:1});

  var ADMIN_KEY='orderDesk.admin.v1', ADMIN_ID='admin', DEFAULT_USER='admin', DEFAULT_PASS='admin123';
  var enc=new TextEncoder(), idleT=null, busy=false;
  function b64(buf){var s='',a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
  function unb64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
  function makeSalt(){var a=new Uint8Array(16);crypto.getRandomValues(a);return b64(a)}
  function hashPw(pw,salt){
    if(window.crypto&&crypto.subtle){
      return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){
        return crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(salt),iterations:150000,hash:'SHA-256'},k,256);
      }).then(b64);
    }
    var h1=5381,h2=52711,t=salt+'|'+pw;
    for(var i=0;i<t.length;i++){var c=t.charCodeAt(i);h1=((h1<<5)+h1+c)|0;h2=((h2<<5)^h2^c)|0}
    return Promise.resolve('f'+(h1>>>0).toString(36)+(h2>>>0).toString(36));
  }

      var old=localStorage.getItem(LEGACY_KEY);
      if(!old){var us=JSON.parse(localStorage.getItem(USERS_KEY)||'[]');if(us[0])old=localStorage.getItem('orderDesk.orders.'+us[0].id)}
      if(old)localStorage.setItem(target,old);
    }catch(e){}
  }

  function doLogin(username,pw){
    if(!username||!pw)return showErr('Enter your username and password.');
    var lk=lockInfo(),now=Date.now();
    if(now<lk.until)return showErr('Too many wrong tries. Wait '+Math.ceil((lk.until-now)/1000)+' seconds and try again.');
    setBusy(true);
    ensureAdmin().then(function(adm){
      return hashPw(pw,adm.salt).then(function(h){
        if(h===adm.hash&&username.toLowerCase()===adm.username.toLowerCase()){setLock({n:0,until:0});enterApp(adm);return}
        lk.n=(lk.n||0)+1;
        if(lk.n>=5){setLock({n:0,until:Date.now()+30000});showErr('Too many wrong tries. Wait 30 seconds and try again.')}
        else{setLock({n:lk.n,until:0});showErr('Username or password is incorrect.')}
      });
    }).catch(function(){showErr('Something went wrong. Please try again.')}).then(function(){setBusy(false)});
  }

    while(cur<=en){

      srcRows.map(function(x){return '<tr><td>'+esc(x.name)+'</td><td class="r">'+x.t.n+'</td><td class="r">'+money(x.t.rev)+'</td><td class="r">'+money(x.t.cost)+'</td><td class="r '+plCls(x.t.profit)+'">'+moneyS(x.t.profit)+'</td></tr>'}).join('')+'</tbody></table>';

    h+='<h2>Orders in this period</h2><table><thead><tr><th>Order</th><th>Date and time</th><th>Customer</th><th>From</th><th>Status</th><th class="r">Price</th><th class="r">Cost</th><th class="r">Profit</th></tr></thead><tbody>'+
      list.map(function(o){
        var pr=(+o.price||0)-(+o.cost||0);
        return '<tr><td>'+esc(orderCode(o))+'</td><td>'+esc(fmtDate(o.date)+', '+fmtTime(o.time))+'</td><td>'+esc(o.name)+'</td><td>'+esc(o.source||'-')+'</td><td>'+cap(o.status)+'</td><td class="r">'+money(o.price)+'</td><td class="r">'+money(o.cost)+'</td><td class="r '+plCls(pr)+'">'+moneyS(pr)+'</td></tr>';
      }).join('')+'</tbody><tfoot><tr><td colspan="5">Total</td><td class="r">'+money(T.rev)+'</td><td class="r">'+money(T.cost)+'</td><td class="r '+plCls(T.profit)+'">'+moneyS(T.profit)+'</td></tr></tfoot></table>';
    h+='<p class="rfoot">Profit = price minus cost. Cancelled orders are never counted. Report generated by Order Desk.</p>';
    return h;
  }
  function printReport(){
    var r=dRange();
    $('printReport').innerHTML=buildReport();
    var old=document.title;document.title='Order Desk report - '+r.label;
    function done(){document.title=old;window.removeEventListener('afterprint',done)}
    window.addEventListener('afterprint',done);
    setTimeout(function(){window.print()},60);
  }
  function csvCell(v){v=String(v==null?'':v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
  function exportCsv(){
    var r=dRange(),list=within(r.s,r.e).sort(function(a,b){return stamp(a)<stamp(b)?-1:1}),T=tot(list);
    var head=['Order no','Date','Time','Customer','Phone','Address','Order from','Status','Price','Cost','Profit','Notes'];
    var rows=list.map(function(o){return[orderCode(o),o.date,o.time,o.name,o.phone||'',o.address||'',o.source||'',cap(o.status),+o.price||0,+o.cost||0,(+o.price||0)-(+o.cost||0),o.notes||'']});
    rows.push(['','','','TOTAL','','','','',T.rev,T.cost,T.profit,'']);
    var csv=[head].concat(rows).map(function(row){return row.map(csvCell).join(',')}).join('\r\n');
    var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='order-report-'+r.label.replace(/[^A-Za-z0-9]+/g,'-')+'.csv';
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},600);
    toast('CSV downloaded');
  }
  $('dPdf').addEventListener('click',printReport);
  $('dCsv').addEventListener('click',exportCsv);

  /* ---------- start ---------- */
  var savedMode=null;try{savedMode=localStorage.getItem('orderDesk.mode')}catch(e){}
  mode=(savedMode==='list'||savedMode==='grid')?savedMode:(isMobile()?'grid':'list');
  var sid=null;try{sid=sessionStorage.getItem(SESSION_KEY)}catch(e){}
  var adm0=getAdmin();
  if(sid===ADMIN_ID&&adm0)enterApp(adm0);else showAuth();
})();
</script>
</body>
